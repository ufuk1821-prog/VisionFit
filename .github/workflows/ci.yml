name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: visionfit_test_user
          POSTGRES_PASSWORD: visionfit_test_pass
          POSTGRES_DB: visionfit_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visionfit_test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r backend/requirements.txt
        python -m pip install pytest pytest-cov httpx

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql+psycopg2://visionfit_test_user:visionfit_test_pass@localhost:5432/visionfit_test_db
        JWT_SECRET: test_secret_key_12345
        TESTING: "True"
      run: |
        cd backend
        PYTHONPATH=. python -m pytest --cov=app --cov=main --cov-report=xml