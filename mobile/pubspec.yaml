name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.2
  pedometer: ^4.0.1
  permission_handler: ^11.3.0
  image_picker: ^1.1.2
  camera: ^0.11.0
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0
  flutter_pose_detection: ^0.4.0
  google_fonts: ^6.2.1
  video_player: ^2.9.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21
